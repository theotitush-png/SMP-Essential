name: Build SMP Essentials

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build plugin
        run: gradle --no-daemon clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SMP-Essentials-Paper-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Package resource pack
        run: |
          cd resource-pack
          zip -r ../SMP-Essentials-Resource-Pack.zip .
          cd ..
          sha1sum SMP-Essentials-Resource-Pack.zip | awk '{print $1}' > SMP-Essentials-Resource-Pack.sha1

      - name: Upload resource pack ZIP and SHA-1
        uses: actions/upload-artifact@v4
        with:
          name: SMP-Essentials-Resource-Pack
          path: |
            SMP-Essentials-Resource-Pack.zip
            SMP-Essentials-Resource-Pack.sha1
          if-no-files-found: error
          retention-days: 30
