name: SMPEssentials
version: 1.0.0
main: com.example.smpessentials.SmpEssentials
api-version: '1.21'
author: OpenAI
description: Custom Discord banner bossbar for SMP servers.
commands:
  smpe:
    description: Toggle the Discord banner or reload SMP Essentials.
    usage: /smpe [toggle|reload|help]
    aliases: [smpessentials]
permissions:
  smpe.admin:
    description: Allows reloading SMP Essentials.
    default: op
